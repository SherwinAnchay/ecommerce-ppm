{% extends 'base.html' %}
{% block title %}Accedi — AnchayShop{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="form-card">
            <h2>Accedi</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-gold w-100 mt-2">
                    <i class="bi bi-box-arrow-in-right"></i> Accedi
                </button>
            </form>
            <p class="mt-3 text-center text-muted" style="font-size:0.9rem">
                Non hai un account? <a href="{% url 'accounts:register' %}" style="color:var(--accent)">Registrati</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
