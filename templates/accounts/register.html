{% extends 'base.html' %}
{% block title %}Registrati — AnchayShop{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-5">
        <div class="form-card">
            <h2>Registrati</h2>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-gold w-100 mt-2">
                    <i class="bi bi-person-plus"></i> Crea account
                </button>
            </form>
            <p class="mt-3 text-center text-muted" style="font-size:0.9rem">
                Hai già un account? <a href="{% url 'accounts:login' %}" style="color:var(--accent)">Accedi</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
