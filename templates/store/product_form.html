{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<h2>{{ title }}</h2>
<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary">Salva</button>
    <a href="{% url 'store:manager_dashboard' %}" class="btn btn-secondary ms-2">Annulla</a>
</form>
{% endblock %}
